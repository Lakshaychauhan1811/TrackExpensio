    "python-dotenv>=1.0.0",
    "pydantic>=2.7.4",
    "typing-extensions>=1.14.0",
    "yfinance>=0.2.50",
    "requests>=2.31.0",
    "bcrypt>=4.0.0",
    "fastmcp>=0.1.0",
    "pandas>=2.0.0",
